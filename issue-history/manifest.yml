modules:
  jira:issueActivity:
    - key: issue-history-activity
      title: Work Item History
      resource: main
      resolver:
        function: handler

  jira:projectPage:
    - key: issue-history-project-page
      title: Activities (by Issue History)
      resource: main
      resolver:
        function: handler

  jira:globalPage:
    - key: issue-history-global-page
      title: Issue History
      resource: main
      resolver:
        function: handler

  jira:dashboardGadget:
    - key: issue-history-dashboard-gadget
      title: Issue History Gadget
      description: View recent issue activity, top users, and change stats across your projects
      thumbnail: /thumbnail.svg
      resource: main
      resolver:
        function: handler


  trigger:
    - key: issue-created-trigger
      function: issueCreated
      events:
        - avi:jira:created:issue

    - key: issue-updated-trigger
      function: issueUpdated
      events:
        - avi:jira:updated:issue

    - key: issue-deleted-trigger
      function: issueDeleted
      events:
        - avi:jira:deleted:issue

  function:
    - key: handler
      handler: index.handler

    - key: issueCreated
      handler: index.issueCreated

    - key: issueUpdated
      handler: index.issueUpdated

    - key: issueDeleted
      handler: index.issueDeleted

resources:
  - key: main
    path: static/hello-world/build

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app
    - read:board-scope:jira-software
    - read:project:jira
    - read:sprint:jira-software

app:
  id: ari:cloud:ecosystem::app/3f04a77b-b56f-4958-b226-98e6a5d447eb
  runtime:
    name: nodejs24.x
