modules:
  jira:issueActivity:
    - key: issue-history-activity
      title: Work Item History
      resource: main
      resolver:
        function: handler

  trigger:
    - key: issue-created-trigger
      function: issueCreated
      events:
        - avi:jira:created:issue

    - key: issue-updated-trigger
      function: issueUpdated
      events:
        - avi:jira:updated:issue

  function:
    - key: handler
      handler: index.handler

    - key: issueCreated
      handler: index.issueCreated

    - key: issueUpdated
      handler: index.issueUpdated

resources:
  - key: main
    path: static/hello-world/build

permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - storage:app

app:
  id: ari:cloud:ecosystem::app/69b57f70-19ee-4775-823c-244634d3bfad
  runtime:
    name: nodejs24.x